; F18_RWR built with PlatformIO + pioarduino, so the ESP-IDF libraries can be rebuilt with a custom sdkconfig.
; Build and flash with .\pio.ps1 run -t upload (it uses a project-local PlatformIO in .piocore, not VS Code's).
;
; The custom_sdkconfig lines are Espressif's settings against RGB panel "screen drift": the panel interrupt and
; GDMA run from internal RAM, and code and read-only data run from PSRAM, so flash/cache stalls cannot delay the
; bounce-buffer refill. Changing them makes the first build rebuild the Arduino libraries (slow, once).

[platformio]
src_dir = F18_RWR

[env:rwr]
; Pinned: the cached "stable" (55.03.34) pins a PlatformIO-core archive whose package name no longer matches,
; so its Python setup always fails
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; Hardware settings: 16 MB QIO flash, octal PSRAM, 240 MHz, 3 MB app / 9.9 MB FATFS
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = app3M_fat9M_16MB.csv
board_build.f_cpu = 240000000L
build_flags = -DBOARD_HAS_PSRAM

lib_deps =
  adafruit/Adafruit GFX Library@1.12.6
  bitbank2/JPEGDEC@1.8.4

custom_sdkconfig =
  CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
  CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
  CONFIG_GDMA_ISR_IRAM_SAFE=y
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y

; Set both to your board's COM port (Device Manager > Ports, a CH343 "USB-Enhanced-SERIAL" device)
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
